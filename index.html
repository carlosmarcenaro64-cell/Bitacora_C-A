<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bitácora de C/A | Archivo Eterno</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background-overlay"></div>

<header class="main-header">
    <h1 class="glow-title">BITÁCORA DE C/A</h1>
    <p class="subtitle">Sincronizando memorias con el sistema...</p>
</header>

<main class="container">
    <section class="glass-panel form-card">
        <div class="form-header">
            <h3 id="formTitle">📝 Registrar Nueva Experiencia</h3>
            <span id="statusBadge" class="badge">Sistema Online</span>
        </div>
        
        <div class="input-grid">
            <div class="input-group">
                <label>Tipo de Registro</label>
                <select id="tipoEntrada">
                    <option value="lugar">📍 Salida / Lugar</option>
                    <option value="cine">🎬 Película / Cine</option>
                </select>
            </div>
            <div class="input-group">
                <label>Nombre</label>
                <input type="text" id="nombre" placeholder="¿A dónde fuimos?" required>
            </div>
            <div class="input-group">
                <label>URL de Imagen</label>
                <input type="text" id="foto" placeholder="Enlace de la foto" required>
            </div>
            <div class="input-group">
                <label>Fecha</label>
                <input type="date" id="fecha" required>
            </div>
            <div class="input-group">
                <label>Puntuación (1-10)</label>
                <input type="number" id="rating" min="1" max="10" placeholder="⭐">
            </div>
        </div>

        <div class="textarea-group">
            <textarea id="comentarioPositivo" placeholder="Lo más memorable..."></textarea>
            <textarea id="comentarioNegativo" placeholder="Observaciones técnicas (o lo que no gustó)..."></textarea>
        </div>

        <input type="hidden" id="editKey">
        <div class="form-actions">
            <button class="btn-save" id="btnGuardar">Guardar en la Nube</button>
            <button class="btn-cancel hidden-el" id="btnCancelar">Cancelar Edición</button>
        </div>
    </section>

    <div class="grid-display" id="contenedorPrincipal">
        </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDgc_fOFDZZTcBe2mtD0uGpgcFl4f34oPI",
        authDomain: "bitacora-ca.firebaseapp.com",
        projectId: "bitacora-ca",
        databaseURL: "https://bitacora-ca-default-rtdb.firebaseio.com/"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const aventurasRef = ref(db, 'aventuras');
    const cont = document.getElementById('contenedorPrincipal');

    onValue(aventurasRef, (snap) => {
        const data = snap.val();
        render(data);
        window.rawCache = data;
    });

    const render = (data) => {
        cont.innerHTML = '';
        if (!data) return;

        Object.keys(data).reverse().forEach(id => {
            const e = data[id];
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-image-wrap">
                    <img src="${e.foto}" onerror="this.src='https://via.placeholder.com/400x250/111/fff?text=C/A'">
                    <div class="card-badge">${e.tipo}</div>
                </div>
                <div class="card-content">
                    <h3>${e.nombre}</h3>
                    <div class="card-meta">
                        <span>📅 ${e.fecha}</span>
                        <span class="rating-tag">⭐ ${e.rating}/10</span>
                    </div>
                    <p class="card-text">${e.positivo || ''}</p>
                    <div class="card-actions">
                        <button class="edit-btn" onclick="prepararEdicion('${id}')">Editar</button>
                        <button class="del-btn" onclick="borrar('${id}')">Eliminar</button>
                    </div>
                </div>
            `;
            cont.appendChild(card);
        });
    };

    document.getElementById('btnGuardar').onclick = () => {
        const key = document.getElementById('editKey').value;
        const entry = {
            tipo: document.getElementById('tipoEntrada').value,
            nombre: document.getElementById('nombre').value,
            foto: document.getElementById('foto').value,
            fecha: document.getElementById('fecha').value,
            rating: document.getElementById('rating').value,
            positivo: document.getElementById('comentarioPositivo').value,
            negativo: document.getElementById('comentarioNegativo').value
        };

        if (key) {
            update(ref(db, `aventuras/${key}`), entry).then(() => resetForm());
        } else {
            push(aventurasRef, entry).then(() => resetForm());
        }
    };

    window.prepararEdicion = (id) => {
        const e = window.rawCache[id];
        document.getElementById('editKey').value = id;
        document.getElementById('tipoEntrada').value = e.tipo;
        document.getElementById('nombre').value = e.nombre;
        document.getElementById('foto').value = e.foto;
        document.getElementById('fecha').value = e.fecha;
        document.getElementById('rating').value = e.rating;
        document.getElementById('comentarioPositivo').value = e.positivo;
        document.getElementById('comentarioNegativo').value = e.negativo;
        
        document.getElementById('formTitle').innerText = "✏️ Editando Aventura";
        document.getElementById('btnCancelar').classList.remove('hidden-el');
        window.scrollTo({top: 0, behavior: 'smooth'});
    };

    window.borrar = (id) => confirm("¿Señor, está seguro de eliminar este registro?") && remove(ref(db, `aventuras/${id}`));
    
    const resetForm = () => {
        document.querySelectorAll('input, textarea').forEach(i => i.value = '');
        document.getElementById('editKey').value = '';
        document.getElementById('formTitle').innerText = "📝 Registrar Nueva Experiencia";
        document.getElementById('btnCancelar').classList.add('hidden-el');
    };
    
    document.getElementById('btnCancelar').onclick = resetForm;
</script>
</body>
</html>
